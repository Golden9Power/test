name: Download Full Webpage

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'آدرس کامل صفحه‌ای که می‌خوای دانلود بشه'
        required: true
        type: string
        default: 'https://example.com'

jobs:
  download-page:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: استخراج نام سایت و ایجاد پوشه
        run: |
          SITE_NAME=$(echo "${{ github.event.inputs.target_url }}" | sed -E 's|https?://||' | sed -E 's|www\.||' | cut -d'/' -f1 | sed -E 's/\..*$//')
          echo "SITE_NAME=$SITE_NAME" >> $GITHUB_ENV
          mkdir -p "webs/$SITE_NAME"
          echo "نام سایت: $SITE_NAME"

      - name: دانلود کامل صفحه با wget
        run: |
          wget \
            --mirror \
            --page-requisites \
            --adjust-extension \
            --convert-links \
            --restrict-file-names=windows \
            --no-parent \
            --directory-prefix="webs/${{ env.SITE_NAME }}" \
            --wait=1 \
            --limit-rate=500k \
            --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            --no-check-certificate \
            --timeout=30 \
            --tries=3 \
            "${{ github.event.inputs.target_url }}"

      - name: درست کردن لینک‌های داخلی
        run: |
          find "webs/${{ env.SITE_NAME }}" -name "*.html" -o -name "*.css" -o -name "*.js" | while read file; do
            sed -i 's|https://|http://|g' "$file" 2>/dev/null || true
          done

      - name: ساخت فایل فشرده
        run: |
          cd "webs/${{ env.SITE_NAME }}"
          zip -r "../../${{ env.SITE_NAME }}.zip" .
          cd ../..
          echo "فایل فشرده شد: ${{ env.SITE_NAME }}.zip"

      - name: Commit و Push به ریپازیتوری
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ env.SITE_NAME }}.zip" "webs/${{ env.SITE_NAME }}"
          git commit -m "Download full site: ${{ env.SITE_NAME }} [skip ci]" || echo "No changes to commit"
          git push

      - name: نمایش خلاصه
        run: |
          echo "## ✅ صفحه با موفقیت دانلود شد" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**آدرس اصلی:** ${{ github.event.inputs.target_url }}" >> $GITHUB_STEP_SUMMARY
          echo "**نام سایت:** ${{ env.SITE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 فایل ZIP در مخزن ذخیره شد: **${{ env.SITE_NAME }}.zip**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### نحوه دانلود در Termux:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "curl -L -H \"Accept: application/vnd.github.v3.raw\" \\" >> $GITHUB_STEP_SUMMARY
          echo "  \"https://api.github.com/repos/${{ github.repository }}/contents/${{ env.SITE_NAME }}.zip\" \\" >> $GITHUB_STEP_SUMMARY
          echo "  -o ${{ env.SITE_NAME }}.zip" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY