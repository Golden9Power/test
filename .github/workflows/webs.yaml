name: Download Full Webpage

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'آدرس کامل صفحه (مثلاً https://google.com)'
        required: true
        type: string
        default: 'https://example.com'

jobs:
  download-page:
    runs-on: ubuntu-latest
    
    steps:
      - name: استخراج اسم سایت از URL
        run: |
          # اسم سایت رو از URL درمیاره (مثلاً google.com)
          SITE_NAME=$(echo "${{ github.event.inputs.target_url }}" | sed -E 's|https?://||' | sed -E 's|www\.||' | cut -d'/' -f1)
          echo "SITE_NAME=$SITE_NAME" >> $GITHUB_ENV
          echo "اسم سایت: $SITE_NAME"

      - name: دانلود کامل صفحه
        run: |
          mkdir -p "${{ env.SITE_NAME }}"
          wget \
            --mirror \
            --page-requisites \
            --adjust-extension \
            --convert-links \
            --restrict-file-names=windows \
            --no-parent \
            --directory-prefix="${{ env.SITE_NAME }}" \
            --wait=1 \
            --limit-rate=500k \
            --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            --no-check-certificate \
            --timeout=30 \
            --tries=3 \
            "${{ github.event.inputs.target_url }}"
          
      - name: فشرده‌سازی با اسم سایت
        run: |
          cd "${{ env.SITE_NAME }}"
          zip -r "../${{ env.SITE_NAME }}.zip" .
          cd ..
          
      - name: آپلود فایل نهایی
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SITE_NAME }}
          path: ${{ env.SITE_NAME }}.zip
          retention-days: 7
          
      - name: نمایش خلاصه
        run: |
          echo "## ✅ صفحه ${{ env.SITE_NAME }} با موفقیت دانلود شد" >> $GITHUB_STEP_SUMMARY
          echo "**آدرس:** ${{ github.event.inputs.target_url }}" >> $GITHUB_STEP_SUMMARY