name: Download Single HTML Page

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'آدرس صفحه'
        required: true
        type: string
        default: 'https://google.com'

jobs:
  simple-download:
    runs-on: ubuntu-latest
    
    steps:
      - name: ایجاد پوشه webs
        run: mkdir -p webs
      
      - name: استخراج نام دامنه
        id: get-domain
        run: |
          DOMAIN=$(echo "${{ github.event.inputs.target_url }}" | awk -F/ '{print $3}' | sed 's/www\.//')
          echo "domain=$DOMAIN" >> $GITHUB_OUTPUT
      
      - name: دانلود فایل
        run: |
          cd webs
          curl -L --fail -o "${{ steps.get-domain.outputs.domain }}.html" \
            -H "User-Agent: Mozilla/5.0" \
            "${{ github.event.inputs.target_url }}"
      
      - name: بررسی فایل
        run: |
          ls -la webs/
          echo "حجم فایل:"
          du -sh webs/*
      
      - name: آپلود Artifact
        uses: actions/upload-artifact@v4
        with:
          name: webs-files
          path: webs/
          retention-days: 7