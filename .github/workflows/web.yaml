name: Download Single HTML Page

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'آدرس صفحه'
        required: true
        type: string
        default: 'https://google.com'
      output_folder:
        description: 'پوشه ذخیره سازی'
        required: false
        type: string
        default: 'webs'

jobs:
  download-and-commit:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: استخراج نام دامنه و ایجاد پوشه
        run: |
          DOMAIN=$(echo "${{ github.event.inputs.target_url }}" | awk -F/ '{print $3}' | sed 's/www\.//')
          echo "DOMAIN_NAME=$DOMAIN" >> $GITHUB_ENV
          mkdir -p "${{ github.event.inputs.output_folder }}"
          echo "پوشه ساخته شد: ${{ github.event.inputs.output_folder }}"

      - name: دانلود صفحه HTML
        run: |
          FOLDER="${{ github.event.inputs.output_folder }}"
          FILENAME="${DOMAIN_NAME}.html"
          
          curl -L \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
            -o "${FOLDER}/${FILENAME}" \
            "${{ github.event.inputs.target_url }}"
          
          echo "دانلود شد: ${FOLDER}/${FILENAME}"
          ls -lh "${FOLDER}/${FILENAME}"

      - name: Commit و Push به ریپازیتوری
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ github.event.inputs.output_folder }}"
          git commit -m "Download HTML from ${{ github.event.inputs.target_url }} [skip ci]" || echo "تغییری برای commit وجود ندارد"
          git push