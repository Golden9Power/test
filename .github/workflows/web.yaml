name: Download Single HTML Page

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'آدرس صفحه'
        required: true
        type: string
        default: 'https://google.com'

jobs:
  simple-download:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: استخراج نام دامنه
        id: get-domain
        run: |
          DOMAIN=$(echo "${{ github.event.inputs.target_url }}" | awk -F/ '{print $3}' | sed 's/www\.//')
          echo "domain=$DOMAIN" >> $GITHUB_OUTPUT
          echo "نام دامنه: $DOMAIN"
      
      - name: دانلود و ذخیره فایل
        run: |
          mkdir -p webs
          cd webs
          curl -L --retry 3 --max-time 30 \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            -o "${{ steps.get-domain.outputs.domain }}.html" \
            "${{ github.event.inputs.target_url }}"
          echo "فایل ذخیره شد: $(pwd)/${{ steps.get-domain.outputs.domain }}.html"
          ls -la
          cd ..
      
      - name: بررسی محتویات پوشه webs
        run: |
          echo "=== محتویات پوشه webs ==="
          ls -la webs/
          echo "=== حجم فایل ==="
          du -sh webs/* || echo "فایلی وجود ندارد"
          
      - name: Commit and push فایل به ریپازیتوری
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add webs/ || true
          git commit -m "Add downloaded HTML: ${{ steps.get-domain.outputs.domain }}" || echo "تغییری برای commit وجود ندارد"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}