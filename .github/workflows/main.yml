name: Download File (Meli)

on:
  workflow_dispatch:
    inputs:
      download_url:
        description: 'URL of the file to download'
        required: true
        type: string
      output_folder:
        description: 'Folder to save the file (e.g., downloads/apks)'
        required: false
        type: string
        default: 'downloads'
      output_filename:
        description: 'Optional custom filename (leave empty to use original)'
        required: false
        type: string
        default: ''

jobs:
  download-and-commit:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create output folder
        run: |
          mkdir -p "${{ github.event.inputs.output_folder }}"
          echo "Folder ready: ${{ github.event.inputs.output_folder }}"

      - name: Download file
        run: |
          URL="${{ github.event.inputs.download_url }}"
          FOLDER="${{ github.event.inputs.output_folder }}"
          CUSTOM_NAME="${{ github.event.inputs.output_filename }}"
          
          if [ -n "$CUSTOM_NAME" ]; then
            FILENAME="$CUSTOM_NAME"
          else
            FILENAME=$(basename "$URL")
          fi
          
          wget -O "${FOLDER}/${FILENAME}" "$URL"
          echo "Downloaded: ${FOLDER}/${FILENAME}"
          ls -lh "${FOLDER}/${FILENAME}"

      - name: Commit and push to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ github.event.inputs.output_folder }}"
          git commit -m "Download file from ${{ github.event.inputs.download_url }} [skip ci]" || echo "No changes to commit"
          git push
          mkdir -p "${{ github.event.inputs.output_folder }}"
          echo "Folder ready: ${{ github.event.inputs.output_folder }}"

      - name: Download file
        run: |
          URL="${{ github.event.inputs.download_url }}"
          FOLDER="${{ github.event.inputs.output_folder }}"
          CUSTOM_NAME="${{ github.event.inputs.output_filename }}"

          if [ -n "$CUSTOM_NAME" ]; then
            FILENAME="$CUSTOM_NAME"
          else
            FILENAME=$(basename "$URL")
          fi

          wget -O "${FOLDER}/${FILENAME}" "$URL"
          echo "Downloaded: ${FOLDER}/${FILENAME}"
          ls -lh "${FOLDER}/${FILENAME}"

      - name: Split file into 50 MiB chunks and remove original
        run: |
          output_folder="${{ github.event.inputs.output_folder }}"
          download_url="${{ github.event.inputs.download_url }}"
          output_filename="${{ github.event.inputs.output_filename }}"

          if [ -n "$output_filename" ]; then
            file_path="${output_folder}/${output_filename}"
          else
            file_path="${output_folder}/$(basename "$download_url")"
          fi

          prefix="${output_folder}/$(basename "$file_path" | sed 's/\..*//')_part_"

          echo "Splitting '$file_path' into 50 MiB parts..."
          split -b 50m "$file_path" "$prefix"

          echo "Generated parts:"
          ls -lh "${output_folder}"/*_part_*

          echo "Removing original file to keep size <100 MiB per file..."
          if [ -f "$file_path" ]; then
            rm "$file_path"
          else
            echo "Warning: $file_path is not a file."
          fi

      - name: Commit and push to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ github.event.inputs.output_folder }}"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Download and split file from ${{ github.event.inputs.download_url }} [skip ci]"
            git push
          fi        run: |
